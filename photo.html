<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photographie</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body class="accueil">

    <header class="header">
        <h3><a href="index.html">THÉA DE HOND</a></h3>
    </header>

    <aside>
        <h1>Projet : Photographie</h1>
        <h2>Reproduction de deux photographies de Platon (1968-). Reprise de sa méthode (cadrage, composition, fond) avec une marge d’interprétation. Avec l’aide de Julia Pisarek, Maria Paz San Juan et Lilou Rubio.</h2>
    </aside>

    <main>
        <div class="grid photo-grid">
            <img class="big" src="img/photo/photo-22.png" alt="Photographie" loading="lazy">
            <div class="photo-grid-side">
                <img src="img/photo/photo-02.jpg" alt="Photographie" loading="lazy">
                <img src="img/photo/photo-01.webp" alt="Photographie" loading="lazy">
            </div>
        </div>
        <p>Howard Stern de Platon</p>
        <div class="grid photo-grid">
            <img class="big" src="img/photo/photo-21.png" alt="Photographie" loading="lazy">
            <div class="photo-grid-side">
                <img src="img/photo/photo-06.jpg" alt="Photographie" loading="lazy">
                <img src="img/photo/photo-05.webp" alt="Photographie" loading="lazy">
            </div>
        </div>
        <p>Michael Moore de Platon</p>
    </main>

</body>
</html>
